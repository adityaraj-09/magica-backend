openapi: 3.1.0
info:
  title: Galaxy Agent API
  version: "1.0.0"
  description: |
    Public REST for agent chats, Magica tools, and run status.
    Authenticate with `Authorization: Bearer gxk_live_…`.
servers:
  - url: https://magica-backend-oda9.onrender.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: Chats
  - name: Messages
  - name: Runs
  - name: Magica
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key created in the product. Shown once, prefix `gxk_live_`.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          examples: [UNAUTHORIZED, CHAT_NOT_FOUND, RUN_ACTIVE]
    Chat:
      type: object
      required: [id, title, isFavorite, lastMessageAt, lastMessageId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isFavorite:
          type: boolean
        lastMessageAt:
          type: string
          format: date-time
        lastMessageId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Chat"
        nextCursor:
          type: string
          nullable: true
    QueuedTurn:
      type: object
      required: [chatId, messageId, runId, triggerRunId, status]
      properties:
        chatId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        triggerRunId:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued]
    SendBody:
      type: object
      properties:
        text:
          type: string
          maxLength: 8192
          description: Message text. Required unless `prompt` or `messages` supplies it.
        prompt:
          type: string
          description: Completion alias for `text`.
        messages:
          type: array
          description: OpenAI-style messages. The last user content is the turn text. Content may be a string or parts with `image_url`.
          items:
            type: object
            properties:
              role:
                type: string
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        text:
                          type: string
                        image_url:
                          oneOf:
                            - type: string
                            - type: object
                              properties:
                                url:
                                  type: string
                                  format: uri
        clientMessageId:
          type: string
          format: uuid
        planMode:
          type: boolean
        image_urls:
          type: array
          description: Public http(s) image URLs to attach to this message. The agent can see them. You do not need to upload first.
          items:
            type: string
            format: uri
          maxItems: 8
        image_url:
          type: string
          format: uri
          description: Single public image URL. Same as `image_urls` with one item.
        attachmentIds:
          type: array
          description: IDs from `POST /uploads` or files already in the product. Optional if you upload `file` or pass `image_urls`.
          items:
            type: string
            format: uuid
    MultipartSend:
      type: object
      properties:
        text:
          type: string
        prompt:
          type: string
        chatId:
          type: string
          format: uuid
          description: Only on `POST /completions`. Omit to create a chat.
        planMode:
          type: boolean
        file:
          type: string
          format: binary
          description: Image or video to attach. Repeat the field or use `files` for more than one. Max 20 MB each, 8 files.
        files:
          type: array
          items:
            type: string
            format: binary
        image:
          type: string
          format: binary
    UploadResult:
      type: object
      required: [chatId, attachments]
      properties:
        chatId:
          type: string
          format: uuid
        attachments:
          type: array
          items:
            type: object
            required: [id, filename, mimeType, status]
            properties:
              id:
                type: string
                format: uuid
              filename:
                type: string
              mimeType:
                type: string
              url:
                type: string
                nullable: true
              status:
                type: string
    CompletionBody:
      allOf:
        - $ref: "#/components/schemas/SendBody"
        - type: object
          properties:
            chatId:
              type: string
              format: uuid
              description: Existing chat. Omit this field to create a chat and send in one call.
    RunSnapshot:
      type: object
      required: [chatId, runId, messageId, status]
      properties:
        chatId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        assistantMessageId:
          type: string
          format: uuid
          nullable: true
        triggerRunId:
          type: string
          nullable: true
        status:
          type: string
          enum: [QUEUED, THINKING, WORKING, WAITING, STOPPING, COMPLETE, FAILED, CANCELLED]
        currentStep:
          type: string
          nullable: true
        thinkingDurationMs:
          type: integer
          nullable: true
        progressPercent:
          type: integer
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        tools:
          type: array
          items:
            type: object
            properties:
              toolCallId:
                type: string
              toolName:
                type: string
              status:
                type: string
                enum: [PENDING, RUNNING, SUCCESS, FAILED, CANCELLED]
              errorMessage:
                type: string
                nullable: true
        waitpoint:
          type: object
          nullable: true
          properties:
            waitpointId:
              type: string
              format: uuid
            type:
              type: string
              enum: [OPTIONS, PLAN, CREDIT, MEDIA]
            status:
              type: string
              enum: [WAITING, COMPLETED, EXPIRED, CANCELLED]
            timeoutAt:
              type: string
              format: date-time
            payload: {}
        assistant:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            contentBlocks:
              type: array
              items: {}
    ToolResult:
      type: object
      required: [toolName, output, assets, creditCost, durationMs]
      properties:
        toolName:
          type: string
        output: {}
        assets:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              mimeType:
                type: string
              filename:
                type: string
        creditCost:
          type: string
        providerRunId:
          type: string
        durationMs:
          type: integer
  parameters:
    chatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
paths:
  /chats:
    get:
      tags: [Chats]
      summary: List chats
      operationId: listChats
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Chat page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Chats]
      summary: Create an empty chat
      description: Optional. To send a first message without this step, use `POST /completions` and omit `chatId`.
      operationId: createChat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: Created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
  /chats/{chatId}:
    get:
      tags: [Chats]
      summary: Get a chat
      operationId: getChat
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "404":
          description: Not found, including chats owned by someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Chats]
      summary: Delete a chat
      operationId: deleteChat
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "204":
          description: Soft-deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chats/{chatId}/messages:
    get:
      tags: [Messages]
      summary: List messages
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Messages, newest first, with content blocks and attachments
    post:
      tags: [Messages]
      summary: Send a message in an existing chat
      description: Requires `chatId`. Attach images with `image_urls` (public URLs) or `attachmentIds`. To start a new chat in one call, use `POST /completions` instead.
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBody"
            examples:
              textOnly:
                summary: Text only
                value:
                  text: Summarize what this agent can do
              withImage:
                summary: Text plus an image URL
                value:
                  text: What is in this photo?
                  image_urls:
                    - https://cdn.example.com/photo.jpg
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MultipartSend"
      responses:
        "201":
          description: Turn queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedTurn"
        "200":
          description: Replay of the same clientMessageId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedTurn"
        "409":
          description: A turn is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Send rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chats/{chatId}/completions:
    post:
      tags: [Messages]
      summary: Chat-style completion in an existing chat
      operationId: chatCompletion
      description: Same as send on an existing chat. JSON (`image_urls` / `attachmentIds`) or multipart (`file`).
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBody"
            examples:
              withImage:
                summary: Text plus an image URL
                value:
                  text: Crop the subject
                  image_urls:
                    - https://cdn.example.com/photo.jpg
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MultipartSend"
      responses:
        "202":
          description: Turn queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedTurn"
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedTurn"
  /completions:
    post:
      tags: [Messages]
      summary: Send a message (creates a chat if needed)
      description: |
        One-call send. Omit `chatId` to create a chat and queue the turn.
        Pass `chatId` to continue an existing chat.
        Attach a file with multipart `file`, or pass `image_urls` / `attachmentIds` in JSON.
      operationId: completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionBody"
            examples:
              newChat:
                summary: Send without creating a chat first
                value:
                  text: What is in this photo?
                  image_urls:
                    - https://cdn.example.com/photo.jpg
              existingChat:
                summary: Send into an existing chat
                value:
                  chatId: 11111111-1111-4111-8111-111111111111
                  text: Continue from here
              textOnly:
                summary: Text only, new chat
                value:
                  text: Summarize what this agent can do
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MultipartSend"
            examples:
              upload:
                summary: Send a file without a URL
                value:
                  text: What is in this photo?
                  file: (binary)
      responses:
        "202":
          description: Turn queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedTurn"
  /uploads:
    post:
      tags: [Messages]
      summary: Upload a file
      description: |
        Multipart upload. Creates a chat when `chatId` is omitted.
        Use the returned attachment `id` in `attachmentIds` on send, or send
        the file in the same request on `/completions`.
        Images, video, and audio. 20 MB per file, 8 files.
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                chatId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Files stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Type or size rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: S3 or Transloadit is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chats/{chatId}/runs/{runId}:
    get:
      tags: [Runs]
      summary: Get run status
      operationId: getRun
      description: |
        Poll until status is COMPLETE, FAILED, or CANCELLED.
        The public snapshot does not mint a realtime token.
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
        "404":
          description: Run or chat was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tools/crop_image:
    post:
      tags: [Magica]
      summary: Crop an image
      operationId: cropImage
      description: Blocks until Magica finishes. Exactly one crop rectangle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_url]
              properties:
                image_url:
                  type: string
                x_percent:
                  type: number
                y_percent:
                  type: number
                width_percent:
                  type: number
                height_percent:
                  type: number
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
        "504":
          description: Magica poll timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tools/gpt_image_2:
    post:
      tags: [Magica]
      summary: Generate or edit an image
      operationId: gptImage2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                image_url:
                  type: string
                  description: Present for edit mode.
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/merge_videos:
    post:
      tags: [Magica]
      summary: Merge videos
      operationId: mergeVideos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_urls]
              properties:
                video_urls:
                  type: array
                  items:
                    type: string
                transition:
                  type: string
                  enum: [none, fade, dissolve]
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"

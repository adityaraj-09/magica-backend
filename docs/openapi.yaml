openapi: 3.1.0
info:
  title: Galaxy Agent API
  version: "1.0.0"
  description: |
    Public REST for agent chats, Magica tools, and run status.
    Authenticate with `Authorization: Bearer gxk_live_…`.
servers:
  - url: https://magica-backend-oda9.onrender.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: Chats
  - name: Messages
  - name: Runs
  - name: Magica
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key created in the product. Shown once, prefix `gxk_live_`.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          examples: [UNAUTHORIZED, CHAT_NOT_FOUND, RUN_ACTIVE]
    Chat:
      type: object
      required: [id, title, isFavorite, lastMessageAt, lastMessageId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isFavorite:
          type: boolean
        lastMessageAt:
          type: string
          format: date-time
        lastMessageId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MessageAttachment:
      type: object
      required: [id, filename, mimeType, status]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          description: DIRECT_UPLOAD, MEDIA_LIBRARY, or GENERATED
        filename:
          type: string
        mimeType:
          type: string
        byteSize:
          type: integer
        url:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        status:
          type: string
        origin:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        durationMs:
          type: integer
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    Message:
      type: object
      required: [id, chatId, role, status, contentBlocks, createdAt, attachments]
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        role:
          type: string
        status:
          type: string
        contentBlocks:
          type: array
          items: {}
        createdAt:
          type: string
          format: date-time
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        usage:
          type: object
          properties:
            promptTokens:
              type: integer
            completionTokens:
              type: integer
            credits:
              type: string
            model:
              type: string
              nullable: true
            durationMs:
              type: integer
              nullable: true
        attachments:
          type: array
          description: Files on this message. User uploads and generated images include `id`.
          items:
            $ref: "#/components/schemas/MessageAttachment"
    MessageList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: string
          nullable: true
    ChatList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Chat"
        nextCursor:
          type: string
          nullable: true
    QueuedTurn:
      type: object
      required: [chatId, messageId, runId, triggerRunId, status]
      properties:
        chatId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        triggerRunId:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued]
    SendBody:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 8192
          description: The message to send.
        image_urls:
          type: array
          description: Public http(s) image URLs to attach. Optional if you upload `file` or pass `attachmentIds`.
          items:
            type: string
            format: uri
          maxItems: 8
        attachmentIds:
          type: array
          description: IDs from `POST /uploads` or files already in the product.
          items:
            type: string
            format: uuid
        planMode:
          type: boolean
    MultipartSend:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 8192
          description: The message to send.
        file:
          type: string
          format: binary
          description: Image or video to send with this message. Repeat the field or use `files` for more than one. Max 20 MB each, 8 files.
        files:
          type: array
          items:
            type: string
            format: binary
        planMode:
          type: boolean
    MultipartCompletion:
      allOf:
        - $ref: "#/components/schemas/MultipartSend"
        - type: object
          properties:
            chatId:
              type: string
              format: uuid
              description: Existing chat. Omit to create one.
    UploadResult:
      type: object
      required: [attachments]
      properties:
        chatId:
          type: string
          format: uuid
          nullable: true
          description: Set only when you passed `chatId`. Upload does not create a chat.
        attachments:
          type: array
          items:
            type: object
            required: [id, filename, mimeType, status]
            properties:
              id:
                type: string
                format: uuid
              filename:
                type: string
              mimeType:
                type: string
              url:
                type: string
                nullable: true
              status:
                type: string
    CompletionBody:
      allOf:
        - $ref: "#/components/schemas/SendBody"
        - type: object
          properties:
            chatId:
              type: string
              format: uuid
              description: Existing chat. Omit this field to create a chat and send in one call.
    RunSnapshot:
      type: object
      required: [chatId, runId, messageId, status]
      properties:
        chatId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        assistantMessageId:
          type: string
          format: uuid
          nullable: true
        triggerRunId:
          type: string
          nullable: true
        status:
          type: string
          enum: [QUEUED, THINKING, WORKING, WAITING, STOPPING, COMPLETE, FAILED, CANCELLED]
        currentStep:
          type: string
          nullable: true
        thinkingDurationMs:
          type: integer
          nullable: true
        progressPercent:
          type: integer
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        tools:
          type: array
          items:
            type: object
            properties:
              toolCallId:
                type: string
              toolName:
                type: string
              status:
                type: string
                enum: [PENDING, RUNNING, SUCCESS, FAILED, CANCELLED]
              errorMessage:
                type: string
                nullable: true
        waitpoint:
          type: object
          nullable: true
          properties:
            waitpointId:
              type: string
              format: uuid
            type:
              type: string
              enum: [OPTIONS, PLAN, CREDIT, MEDIA]
            status:
              type: string
              enum: [WAITING, COMPLETED, EXPIRED, CANCELLED]
            timeoutAt:
              type: string
              format: date-time
            payload: {}
        assistant:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            contentBlocks:
              type: array
              items: {}
    ToolResult:
      type: object
      required: [toolName, output, assets, creditCost, durationMs]
      properties:
        toolName:
          type: string
        output: {}
        assets:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              mimeType:
                type: string
              filename:
                type: string
        creditCost:
          type: string
        providerRunId:
          type: string
        durationMs:
          type: integer
  parameters:
    chatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
paths:
  /chats:
    get:
      tags: [Chats]
      summary: List chats
      operationId: listChats
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Chat page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Chats]
      summary: Create an empty chat
      description: Optional. To send a first message without this step, use `POST /completions` and omit `chatId`.
      operationId: createChat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: Created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
  /chats/{chatId}:
    get:
      tags: [Chats]
      summary: Get a chat
      operationId: getChat
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: Chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "404":
          description: Not found, including chats owned by someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Chats]
      summary: Delete a chat
      operationId: deleteChat
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "204":
          description: Soft-deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chats/{chatId}/messages:
    get:
      tags: [Messages]
      summary: List messages
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Messages, newest first. Each item includes `attachments` with `id` when the message has files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
              examples:
                withFile:
                  summary: User message with an uploaded image
                  value:
                    items:
                      - id: 55555555-5555-5555-5555-555555555555
                        chatId: 11111111-1111-4111-8111-111111111111
                        role: USER
                        status: SUCCESS
                        contentBlocks:
                          - type: text
                            text: What is in this photo?
                        createdAt: "2026-09-23T12:00:00.000Z"
                        errorCode: null
                        errorMessage: null
                        attachments:
                          - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                            source: DIRECT_UPLOAD
                            filename: photo.jpg
                            mimeType: image/jpeg
                            url: https://cdn.example.com/photo.jpg
                            status: COMPLETE
                            origin: UPLOAD
                    nextCursor: null
        "404":
          description: Chat was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /completions:
    post:
      tags: [Messages]
      summary: Send a message (creates a chat if needed)
      description: |
        One-call send. Omit `chatId` to create a chat and queue the turn.
        Pass `chatId` to continue an existing chat.
        Upload an image with multipart `text` + `file` in the same request,
        or pass `image_urls` in JSON if the file is already hosted.
      operationId: completion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MultipartCompletion"
            examples:
              withFile:
                summary: Text plus an uploaded image
                value:
                  text: What is in this photo?
                  file: (binary)
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionBody"
            examples:
              newChat:
                summary: Text plus an image URL
                value:
                  text: What is in this photo?
                  image_urls:
                    - https://cdn.example.com/photo.jpg
              existingChat:
                summary: Send into an existing chat
                value:
                  chatId: 11111111-1111-4111-8111-111111111111
                  text: Continue from here
              textOnly:
                summary: Text only, new chat
                value:
                  text: Summarize what this agent can do
      responses:
        "202":
          description: Turn queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedTurn"
        "409":
          description: A turn is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Send rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /uploads:
    post:
      tags: [Messages]
      summary: Upload a file
      description: |
        Multipart upload. Stores the file and returns an attachment id.
        Pass `chatId` only to attach it to an existing chat. Omitting `chatId`
        does not create a chat — use `attachmentIds` on send, or upload in
        the same request on `/completions`.
        Images, video, and audio. 20 MB per file, 8 files.
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                chatId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Files stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Type or size rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: S3 or Transloadit is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chats/{chatId}/runs/{runId}:
    get:
      tags: [Runs]
      summary: Get run status
      operationId: getRun
      description: |
        Poll until status is COMPLETE, FAILED, or CANCELLED.
        The public snapshot does not mint a realtime token.
      parameters:
        - $ref: "#/components/parameters/chatId"
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
        "404":
          description: Run or chat was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tools/crop_image:
    post:
      tags: [Magica]
      summary: Crop an image
      operationId: cropImage
      description: Blocks until Magica finishes. Exactly one crop rectangle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_url]
              properties:
                image_url:
                  type: string
                x_percent:
                  type: number
                y_percent:
                  type: number
                width_percent:
                  type: number
                height_percent:
                  type: number
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
        "504":
          description: Magica poll timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tools/gpt_image_2:
    post:
      tags: [Magica]
      summary: Generate or edit an image
      operationId: gptImage2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                image_url:
                  type: string
                  description: Present for edit mode.
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
  /tools/merge_videos:
    post:
      tags: [Magica]
      summary: Merge videos
      operationId: mergeVideos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_urls]
              properties:
                video_urls:
                  type: array
                  items:
                    type: string
                transition:
                  type: string
                  enum: [none, fade, dissolve]
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
